name: Test Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test artifact
        run: |
          mkdir -p artifacts
          tar -C book-shop \
            --exclude='.git' \
            --exclude='artifacts' \
            --exclude='db.sqlite3' \
            -czf artifacts/app-${{ github.sha }}.tar.gz .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image from fresh artifact
        run: |
          docker build \
            -f book-shop/Dockerfile \
            --build-arg ARTIFACT_PATH=../artifacts/app-${{ github.sha }}.tar.gz \
            -t osoub111/book-shop:${{ github.sha }} \
            .

      - name: Push Docker image to Docker Hub
        run: |
          docker push osoub111/book-shop:${{ github.sha }}
