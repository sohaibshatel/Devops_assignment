name: Prod Pipeline

on:
  push:
    branches:
      - prod

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Show production image
        run: |
          echo "Promoting image: ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_VERSION }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull production image
        run: |
          docker pull ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_VERSION }}
